<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gestão Filhas do Rei 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f4ebda;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #1f2916;
      padding: 50px 10px 10px 10px;
    }

    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(11, 45, 0, 0.1);
      padding: 30px;
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(78, 117, 44, 0.15);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h3 {
      color: #00490e;
      font-weight: 700;
    }

    .login-header img {
      height: 90px;
      margin-bottom: 15px;
    }

    .form-label {
      color: #1f2916;
      font-weight: 600;
    }

    .form-label i {
      color: #00490e;
    }

    .form-control:focus {
      border-color: #4e752c;
      box-shadow: 0 0 0 0.25rem rgba(78, 117, 44, 0.25);
    }

    .btn-login {
      background: linear-gradient(to right, #00490e, #4e752c);
      border: none;
      padding: 12px;
      font-weight: bold;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(11, 45, 0, 0.3);
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      background: linear-gradient(to right, #4e752c, #00490e);
      color: white;
      box-shadow: 0 6px 20px rgba(11, 45, 0, 0.4);
      transform: translateY(-1px);
    }

    .alert {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-header">
      <img src="assets/Logo.png" alt="Logo">
      <h3>Gestão Filhas do Rei 2026</h3>
      <p class="text-muted">Painel Administrativo</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="password" class="form-label">
          <i class="bi bi-lock"></i> Senha de Acesso
        </label>
        <input type="password" class="form-control" id="password" placeholder="Digite a senha" required>
      </div>

      <button type="submit" class="btn btn-primary btn-login w-100">
        <i class="bi bi-box-arrow-in-right"></i> Entrar
      </button>
    </form>

    <div id="errorAlert" class="alert alert-danger" style="display: none;">
      <i class="bi bi-exclamation-triangle"></i> Senha incorreta. Tente novamente.
    </div>
  </div>

  <script>
    // Senha simples para demonstração (em produção, usar autenticação mais robusta)
    const ADMIN_PASSWORD = 'Filhas123';

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');

      if (password === ADMIN_PASSWORD) {
        // Salvar autenticação no localStorage
        localStorage.setItem('adminAuthenticated', 'true');
        localStorage.setItem('authTimestamp', Date.now().toString());

        // Redirecionar para o painel
        window.location.href = 'pages/gestao.html';
      } else {
        // Mostrar erro
        errorAlert.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();

        // Esconder erro após 3 segundos
        setTimeout(() => {
          errorAlert.style.display = 'none';
        }, 3000);
      }
    });

    // Verificar se já está autenticado
    window.addEventListener('load', function () {
      const isAuthenticated = localStorage.getItem('adminAuthenticated');
      const authTimestamp = localStorage.getItem('authTimestamp');

      if (isAuthenticated === 'true' && authTimestamp) {
        const now = Date.now();
        const authTime = parseInt(authTimestamp);
        const hoursPassed = (now - authTime) / (1000 * 60 * 60);

        // Autenticação válida por 24 horas
        if (hoursPassed < 24) {
          window.location.href = 'pages/gestao.html';
        } else {
          // Limpar autenticação expirada
          localStorage.removeItem('adminAuthenticated');
          localStorage.removeItem('authTimestamp');
        }
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
